name: inference
device: cuda
gpus: [0]
mode: standard
# RAM pipeline: extract/model/post run as overlapping threads instead of the
# sequential disk-PNG path, one shared model/GPU across segments (not one
# model copy per segment). Off by default; the disk path is unchanged when
# this is false. Folder mode requires runner.mode=csv_only when this is on
# (no annotated-video rendering yet).
use_ram_pipeline: false
queue_maxsize: 128
# Segments processed in parallel when use_ram_pipeline is true (1-6). Ignored
# by the disk path, which is always sequential.
num_segment_workers: 1
keep_extracted_frames: true
vis_result: True
vis_hm: True
vis_traj: False
model_path: 
eval:
  score_threshold: 0.5
visualization:
  show_speed_direction: True
  # Primary speed/direction path: reconstruct airborne motion in 3-D from
  # camera pose + gravity, then differentiate a local polynomial fit.
  speed_window_frames: 9
  direction_window_frames: 5
  speed_smoothing_alpha: 0.35
  direction_change_threshold_deg: 95
  direction_min_distance_m: 0.012
  direction_min_speed_kmh: 3.0
  reversal_confirm_frames: 2
  direction_smoothing_alpha: 1.0

  # Physical 3-D kinematics.
  kinematics_min_track: 12
  kinematics_max_gap: 3
  kinematics_max_px_step: 140
  kinematics_max_px_accel: 45
  kinematics_polynomial_degree: 2
  kinematics_plane_margin_m: 1.0
  kinematics_max_fit_rms_m: 0.25
  kinematics_max_reproj_px: 8.0
  kinematics_gravity_weight: 3.0

  hud_position: top_center
