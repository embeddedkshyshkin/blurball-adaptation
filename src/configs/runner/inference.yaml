name: inference
device: cuda
gpus: [0]
mode: standard
keep_extracted_frames: true
vis_result: True
vis_hm: True
vis_traj: False
model_path: 
eval:
  score_threshold: 0.5
visualization:
  show_speed_direction: True
  # Speed benefits from a longer local fit; direction must stay responsive.
  speed_window_frames: 9
  direction_window_frames: 5
  speed_smoothing_alpha: 0.35
  direction_change_threshold_deg: 95
  direction_min_distance_m: 0.012
  direction_min_speed_kmh: 3.0
  reversal_confirm_frames: 2
  direction_smoothing_alpha: 1.0
  hud_position: top_center
